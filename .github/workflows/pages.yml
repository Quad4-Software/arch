# Pinned first-party actions (bump tag and SHA together when upgrading):
#   actions/checkout@v7.0.1                     3d3c42e5aac5ba805825da76410c181273ba90b1
#   actions/configure-pages@v6.0.0              45bfe0192ca1faeb007ade9deae92b16b8254a0d
#   actions/upload-pages-artifact@v5.0.0        fc324d3547104276b827a68afc52ff2a11cc49c9
#   actions/deploy-pages@v5.0.1                 368f82528645a54fb793d4d04e342629a3f51346
#
# Deploys the Pages site so GitHub can verify arch.quad4.io.
# Package files are added later by the Publish repo workflow.
name: GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: Deploy site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: https://arch.quad4.io
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enable Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: sh scripts/pages-github.sh enable

      - name: Assemble site
        run: sh scripts/assemble-pages.sh

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public
          include-hidden-files: true

      - name: Deploy Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Attach custom domain
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: sh scripts/pages-github.sh domain
