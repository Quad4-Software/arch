# Add to /etc/pacman.conf after the official [core]/[extra] blocks.
# Primary Server is https://cdn.quad4.io/arch.
# The GitHub Pages site at arch.quad4.io is the fallback Server.
# Import the packaging key from https://arch.quad4.io/quad4.gpg before
# switching SigLevel to Required.

[quad4]
SigLevel = PackageRequired DatabaseRequired
Server = https://cdn.quad4.io/arch/$arch
Server = https://arch.quad4.io/$arch
