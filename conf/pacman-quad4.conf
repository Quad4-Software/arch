# Add to /etc/pacman.conf after the official [core]/[extra] blocks.
# Primary Server is https://arch.quad4.io.
# The rolling GitHub Release named "repo" is the fallback Server.

[quad4]
SigLevel = Optional TrustAll
Server = https://arch.quad4.io/$arch
Server = https://github.com/Quad4-Software/arch/releases/download/repo-$arch
