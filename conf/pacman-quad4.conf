# Add to /etc/pacman.conf after the official [core]/[extra] blocks.
# Primary Server is https://cdn.quad4.io/arch.
# The rolling GitHub Release named "pkg" is the fallback Server.

[quad4]
SigLevel = Optional TrustAll
Server = https://cdn.quad4.io/arch/$arch
Server = https://github.com/Quad4-Software/arch/releases/download/pkg-$arch
